name: lemu_analytics
description: >-
  Lemu tracking SDK for Flutter. Sends events, purchases, identity, app
  lifecycle, deep links and screen views to Lemu with an offline queue.
version: 1.0.0
homepage: https://lemuai.com
repository: https://github.com/LemuAI/lemu-sdks
issue_tracker: https://github.com/LemuAI/lemu-sdks/issues
documentation: https://docs.lemuai.com
topics:
  - analytics
  - tracking
  - attribution
  - marketing

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  device_info_plus: '>=11.0.0 <14.0.0'
  flutter:
    sdk: flutter
  http: '>=1.2.0 <2.0.0'
  package_info_plus: '>=8.0.0 <11.0.0'
  shared_preferences: ^2.2.0
  web: '>=1.0.0 <2.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

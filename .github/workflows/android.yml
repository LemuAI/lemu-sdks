name: android

on:
  pull_request:
    paths:
      - "android/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: android

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # lemu-core: conformance scenarios C01-C20 against a local fake ingest server.
      # lemu-android and sample: unit tests, lint, debug and release builds (sample is minified with R8).
      - name: Test, lint and assemble
        run: ./gradlew test lint assemble --stacktrace

      - name: Minified app without the optional install referrer library
        run: ./gradlew :sample:assembleRelease -PwithoutInstallReferrer

      - name: Check the publication builds
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/

  publish:
    # Releases com.lemuai:analytics and com.lemuai:analytics-core to Maven Central
    # when a tag such as android-v1.0.0 is pushed.
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not android-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build signed bundle
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          ./gradlew cleanStaging publishAllPublicationsToStagingRepository
          cd build/staging-deploy
          find . -name 'maven-metadata*' -delete
          if [ -z "$(find . -name '*.asc' | head -1)" ]; then
            echo "Artifacts are not signed" >&2
            exit 1
          fi
          zip -qr ../central-bundle.zip .
          unzip -l ../central-bundle.zip

      - name: Upload to the Maven Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\n')
          DEPLOYMENT=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=lemu-android-$VERSION&publishingType=AUTOMATIC")
          echo "Deployment $DEPLOYMENT"
          for i in $(seq 1 60); do
            sleep 20
            STATE=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT" | jq -r .deploymentState)
            echo "State: $STATE"
            case "$STATE" in
              PUBLISHED|PUBLISHING) exit 0 ;;
              FAILED)
                curl -sS -X POST -H "Authorization: Bearer $TOKEN" "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT"
                exit 1 ;;
            esac
          done
          echo "Timed out waiting for Maven Central validation" >&2
          exit 1
